<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Delete Questionnaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 50px;
        }

        .card {
            max-width: 500px;
            margin: 0 auto;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <div class="card shadow-sm">
        <div class="card-body text-center">
            <h3 class="mb-4">Delete Questionnaire?</h3>
            <p class="text-muted">Are you sure you want to delete "<strong>{{ questionnaire.title }}</strong>"? This
                action cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3 mt-4">
                    <a href="{% url 'questionnaire_list' %}" class="btn btn-light border px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Delete Permanently</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
