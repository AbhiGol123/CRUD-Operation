{% extends 'items/base.html' %}

{% block title %}Delete Item - Inventory Systems{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto; text-align: center;">
    <h1 style="margin-bottom: 2rem;">Confirm Deletion</h1>

    <div class="card" style="border-color: var(--danger);">
        <p style="font-size: 1.125rem; margin-bottom: 2rem;">Are you sure you want to delete "<strong>{{ item.name
                }}</strong>"? This action cannot be undone.</p>

        <form method="post">
            {% csrf_token %}
            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-danger" style="flex: 1; padding: 0.75rem;">Yes, Delete
                    Item</button>
                <a href="{% url 'item_list' %}" class="btn"
                    style="flex: 1; text-align: center; background: var(--border); padding: 0.75rem;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
